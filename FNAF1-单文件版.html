<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="dark" />
<title>FNAF 1-Lite · 单文件版</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;background:#000;overflow:hidden;
  font-family:"Trebuchet MS","Microsoft YaHei",system-ui,sans-serif;color:#cbd5e1}
#game{position:fixed;inset:0}
#game canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#fx{z-index:1}
#scene{z-index:2}
#ui{z-index:3;position:absolute;inset:0;width:100%;height:100%}
#boot{position:fixed;inset:0;z-index:99;display:grid;place-items:center;
  background:#000;transition:opacity .5s ease}
#boot.gone{opacity:0;pointer-events:none}
#boot .box{text-align:center;max-width:min(680px,88vw)}
#boot h1{font-size:clamp(20px,3.4vw,34px);letter-spacing:.18em;color:#c9a227;margin:0 0 .6em}
#boot p{font-size:13px;line-height:2;color:#6b7280;margin:.4em 0}
#boot .err{color:#f87171;font-size:14px;line-height:1.9;text-align:left;
  background:#160a0a;border:1px solid #7f1d1d;padding:14px 18px;margin-top:1.2em;
  white-space:pre-wrap;word-break:break-word}
#boot button{margin-top:1.8em;padding:.8em 2.4em;font-size:13px;letter-spacing:.24em;
  color:#e5d9a8;background:#1a1408;border:1px solid #4a3d1c;cursor:pointer}
#boot button:hover{background:#2a2010;border-color:#8a7135}
#boot .spin{width:26px;height:26px;margin:0 auto 1.2em;border:2px solid #333;
  border-top-color:#c9a227;border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="game">
  <canvas id="fx"></canvas>
  <canvas id="scene"></canvas>
  <svg id="ui" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid meet"></svg>
</div>

<div id="boot">
  <div class="box">
    <div class="spin" id="boot-spin"></div>
    <h1>FNAF 1-Lite</h1>
    <p>单文件版 · 双击即玩 · 不需要服务器</p>
    <p id="boot-status">正在载入…</p>
    <div class="err" id="boot-detail" hidden></div>
    <div id="boot-actions" hidden>
      <button id="boot-start">进入游戏</button>
    </div>
  </div>
</div>

rSide":"right","startRoom":"stage","retreatRoom":"stage","movementInterval":5.2,"attackDelay":5.6,"retreatCooldown":3,"cameraDeterrence":0.5,"freezeWhenWatched":false,"moveOnlyWhenCamerasDown":false,"allowedRooms":["stage","dining","restrooms","kitchen","eastHall","eastCorner","eastDoor"],"routeBias":{"kitchen":1.4,"eastHall":1.5,"eastCorner":1.8},"ai":{"1":1,"2":3,"3":5,"4":8,"5":10,"6":13,"7":17},"hourRamp":1,"powerOutAttack":false,"scare":{"jitter":15,"flashHz":17,"tint":"#fff6c8"},"sounds":{"presence":"footstep","attack":"screech","blocked":"bang"}},{"id":"vulpi","name":"Vulpi","desc":"红色狐狸。躲在 Pirate Cove，不盯监控它就冲出来；冲到门口前关门可挡下，但要扣电。","shape":"fox","color":"#b4392f","accent":"#3a0f0c","eyeColor":"#ffd166","type":"rusher","doorSide":"left","startRoom":"pirateCove","retreatRoom":"pirateCove","watchRoom":"pirateCove","movementInterval":5,"stageInterval":5.5,"rushDuration":1.6,"attackDelay":0.8,"retreatCooldown":4.5,"cameraDeterrence":1,"freezeWhenWatched":false,"moveOnlyWhenCamerasDown":false,"rushStages":["pirateCove","pirateCove","pirateCove","westHall","westCorner","westDoor"],"rushPowerPenalty":5,"allowedRooms":["pirateCove","westHall","westCorner","westDoor"],"routeBias":{"westHall":2,"westCorner":2.5},"ai":{"1":1,"2":3,"3":5,"4":7,"5":10,"6":13,"7":17},"hourRamp":1,"powerOutAttack":false,"scare":{"jitter":20,"flashHz":22,"tint":"#ffd9d0"},"sounds":{"presence":"run","attack":"screech","blocked":"bang"}},{"id":"goldi","name":"Goldi","desc":"金色熊。只有在你「没看监控」的时候才移动，停电后会直接走进办公室。","shape":"bear","color":"#c9a227","accent":"#3a2c07","eyeColor":"#ffffff","type":"shadow","doorSide":"right","startRoom":"dining","retreatRoom":"dining","movementInterval":5.4,"attackDelay":4,"retreatCooldown":4,"cameraDeterrence":1,"freezeWhenWatched":true,"moveOnlyWhenCamerasDown":true,"allowedRooms":["dining","restrooms","eastHall","eastCorner","eastDoor"],"routeBias":{"eastHall":1.6,"eastCorner":2.2},"ai":{"1":0,"2":0,"3":1,"4":2,"5":4,"6":7,"7":12},"hourRamp":1,"powerOutAttack":true,"powerOutDelay":{"min":6,"max":16},"scare":{"jitter":12,"flashHz":14,"tint":"#fff3cf"},"sounds":{"presence":"laugh","attack":"screech","blocked":"bang"}}]}};

(function () {
  var nativeFetch = window.fetch ? window.fetch.bind(window) : null;
  window.fetch = function (input, init) {
    var url = typeof input === 'string' ? input : (input && input.url) || '';
    var key = String(url).replace(/^\.\//, '').replace(/^\//, '').split('?')[0].split('#')[0];
    for (var k in window.__FNAF_EMBEDDED__) {
      if (k.replace(/^\.\//, '') === key) {
        return Promise.resolve(new Response(
          JSON.stringify(window.__FNAF_EMBEDDED__[k]),
          { status: 200, headers: { 'Content-Type': 'application/json' } }
        ));
      }
    }
    // 音效素材本来就不存在：直接拒绝，AudioSystem 会静默回退到合成音
    return Promise.reject(new Error('单文件版没有外部素材: ' + url));
  };
})();

<script>
/* 单文件版的启动看门狗：万一脚本没跑起来，给一句人话，而不是一片黑屏。 */
(function () {
  var boot = document.getElementById('boot');
  var status = document.getElementById('boot-status');
  var detail = document.getElementById('boot-detail');
  var actions = document.getElementById('boot-actions');
  var startBtn = document.getElementById('boot-start');

  function reveal() {
    if (document.body.dataset.fnafReady) return;
    document.body.dataset.fnafReady = '1';
    status.textContent = '需要一次点击才能启动音频';
    actions.hidden = false;
  }

  window.__fnafBootOk = function () {
    reveal();
    startBtn.addEventListener('click', function () {
      boot.classList.add('gone');
      setTimeout(function () { boot.remove(); }, 600);
      window.dispatchEvent(new Event('pointerdown'));
    }, { once: true });
  };

  window.__fnafBootFail = function (err) {
    if (document.body.dataset.fnafReady && !document.body.dataset.fnafFailed) return;
    document.body.dataset.fnafFailed = '1';
    status.innerHTML = '<b style="color:#f87171">启动失败</b>';
    detail.hidden = false;
    detail.textContent = String((err && err.stack) || (err && err.message) || err || '未知错误');
    actions.hidden = true;
  };

  window.addEventListener('error', function (e) {
    if (!document.body.dataset.fnafReady) window.__fnafBootFail(e.error || e.message);
  });
  window.addEventListener('unhandledrejection', function (e) {
    if (!document.body.dataset.fnafReady) window.__fnafBootFail(e.reason);
  });

  // 8 秒还没就绪 → 大概率是脚本根本没执行
  setTimeout(function () {
    if (!document.body.dataset.fnafReady) {
      window.__fnafBootFail('脚本没有跑起来（8 秒超时）。\n' +
        '常见原因：浏览器太老，不认识 <script type="module">。\n' +
        '换最新版 Chrome / Edge 再试。');
    }
  }, 8000);
})();
</script>

<script type="module">
/* ───────────── 模块注册表 ─────────────
   每个模块是一个工厂函数；exports 先占位再执行，
   这样即使出现交叉引用也不会死循环。 */
const __mods = Object.create(null);
const __cache = Object.create(null);
function __req(key) {
  if (__cache[key]) return __cache[key];
  const factory = __mods[key];
  if (!factory) throw new Error('模块缺失: ' + key);
  const exports = {};
  __cache[key] = exports;
  factory(exports);
  return exports;
}

/* ───────────── src/render/SVGRenderer.js ───────────── */
__mods["src/render/SVGRenderer.js"] = function (exports) {
/**
 * render/SVGRenderer.js —— SVG UI 的创建与更新工具
 *
 * 所有界面（按钮、电力条、时间、菜单、办公室静态场景、监控面板边框）都用 SVG 画，
 * 这个类负责：
 *   - 统一创建元素（带命名空间与属性批量设置）
 *   - <symbol> + <use> 复用（门板、图标、玩偶头像等只写一次路径）
 *   - 命名图层（<g>）管理：不同 UI 组件各占一层，互不干扰
 *   - setAttr 只在值真的变化时才写 DOM，避免每帧无谓的样式重算
 *   - 鼠标坐标 -> viewBox 逻辑坐标（保证点击判定与视觉完全一致）
 *
 * 注意：本项目不使用 SMIL；动画全部交给 CSS transition / animation（见各组件注入的样式）。
 */

const SVG_NS = 'http://www.w3.org/2000/svg';

/** 创建 SVG 元素（带命名空间 + 属性） */
function createSvgEl(tag, attrs = {}, parent = null) {
  const el = document.createElementNS(SVG_NS, tag);
  for (const [key, value] of Object.entries(attrs)) {
    if (value === null || value === undefined) continue;
    el.setAttribute(key, String(value));
  }
  if (parent) parent.appendChild(el);
  return el;
}

/**
 * 注入 <style>（同一个 id 只注入一次）。
 * index.html 里不写 CSS，样式由拥有它的模块自己注入，方便模块化维护。
 */
function injectStyle(id, css) {
  if (document.getElementById(id)) return;
  const style = document.createElement('style');
  style.id = id;
  style.textContent = css;
  document.head.appendChild(style);
}

class SVGRenderer {
  /**
   * @param {SVGSVGElement} svgEl 页面上的 <svg id="ui">
   * @param {object} [options]
   * @param {number} [options.width=1280]
   * @param {number} [options.height=720]
   */
  constructor(svgEl, { width = 1280, height = 720 } = {}) {
    this.root = svgEl;
    this.width = width;
    this.height = height;
    this.root.setAttribute('viewBox', `0 0 ${width} ${height}`);
    this.root.setAttribute('preserveAspectRatio', 'xMidYMid meet');

    /** @type {Map<string, SVGGElement>} */
    this.layers = new Map();
    /** @type {Map<string, SVGElement>} */
    this.symbols = new Map();

    this.defs = createSvgEl('defs', {}, this.root);
    this.defs.id = 'ui-defs';
  }

  // ---------------------------------------------------------------- 图层

  /**
   * 取得（必要时创建）命名图层。index 越大越靠上。
   * 同名的图层会一直复用，所以场景切换时用 clearLayer 清内容即可。
   */
  layer(name, index = 100) {
    if (this.layers.has(name)) return this.layers.get(name);
    const group = createSvgEl('g', { id: `layer-${name}` }, this.root);
    group.dataset.layerIndex = String(index);
    this.layers.set(name, group);
    this._reorderLayers();
    return group;
  }

  getLayer(name) {
    return this.layers.get(name) || null;
  }

  /** 清空一个图层里的全部子节点 */
  clearLayer(name) {
    const group = this.layers.get(name);
    if (group) {
      while (group.firstChild) group.removeChild(group.firstChild);
    }
    return group;
  }

  /** 删除图层本身 */
  removeLayer(name) {
    const group = this.layers.get(name);
    if (group && group.parentNode) group.parentNode.removeChild(group);
    this.layers.delete(name);
  }

  /** 按 dataset.layerIndex 排序，保证叠加顺序稳定 */
  _reorderLayers() {
    const sorted = Array.from(this.layers.values()).sort(
      (a, b) => Number(a.dataset.layerIndex) - Number(b.dataset.layerIndex)
    );
    for (const group of sorted) this.root.appendChild(group);
  }

  // ---------------------------------------------------------------- symbol / use

  /**
   * 定义 <symbol>（同一份路径可以被多处以 <use> 引用，禁止重复写相同 path）。
   * @param {string} id
   * @param {string|object} viewBox '0 0 100 100' 或 {x,y,w,h}
   * @param {(parent: SVGElement, renderer: SVGRenderer) => void} build
   */
  addSymbol(id, viewBox, build) {
    const key = `sym-${id}`;
    if (this.symbols.has(key)) return this.symbols.get(key);

    const vb = typeof viewBox === 'string'
      ? viewBox
      : `${viewBox.x} ${viewBox.y} ${viewBox.w} ${viewBox.h}`;

    const symbol = createSvgEl('symbol', { id: key, viewBox: vb }, this.defs);
    build(symbol, this);
    this.symbols.set(key, symbol);
    return symbol;
  }

  hasSymbol(id) {
    return this.symbols.has(`sym-${id}`);
  }

  /**
   * 引用一个 symbol。
   * @param {string} id addSymbol 时用的 id
   * @param {object} attrs 位置尺寸等
   * @param {SVGElement} parent
   */
  use(id, attrs = {}, parent = null) {
    const key = `sym-${id}`;
    const el = createSvgEl('use', { href: `#${key}`, 'xlink:href': `#${key}`, ...attrs }, parent);
    return el;
  }

  /** 定义一个线性渐变（返回 url(#id)） */
  addLinearGradient(id, stops, { x1 = 0, y1 = 0, x2 = 0, y2 = 1 } = {}) {
    const gradId = `grad-${id}`;
    if (document.getElementById(gradId)) return `url(#${gradId})`;
    const grad = createSvgEl('linearGradient', { id: gradId, x1, y1, x2, y2 }, this.defs);
    for (const stop of stops) {
      createSvgEl('stop', { offset: stop.offset, 'stop-color': stop.color, 'stop-opacity': stop.opacity ?? 1 }, grad);
    }
    return `url(#${gradId})`;
  }

  /** 定义一个径向渐变（返回 url(#id)） */
  addRadialGradient(id, stops, { cx = 0.5, cy = 0.5, r = 0.5 } = {}) {
    const gradId = `grad-${id}`;
    if (document.getElementById(gradId)) return `url(#${gradId})`;
    const grad = createSvgEl('radialGradient', { id: gradId, cx, cy, r }, this.defs);
    for (const stop of stops) {
      createSvgEl('stop', { offset: stop.offset, 'stop-color': stop.color, 'stop-opacity': stop.opacity ?? 1 }, grad);
    }
    return `url(#${gradId})`;
  }

  // ---------------------------------------------------------------- 元素创建

  group(attrs = {}, parent = null) {
    return createSvgEl('g', attrs, parent);
  }

  rect(x, y, width, height, attrs = {}, parent = null) {
    return createSvgEl('rect', { x, y, width, height, ...attrs }, parent);
  }

  circle(cx, cy, r, attrs = {}, parent = null) {
    return createSvgEl('circle', { cx, cy, r, ...attrs }, parent);
  }

  path(d, attrs = {}, parent = null) {
    return createSvgEl('path', { d, ...attrs }, parent);
  }

  line(x1, y1, x2, y2, attrs = {}, parent = null) {
    return createSvgEl('line', { x1, y1, x2, y2, ...attrs }, parent);
  }

  text(x, y, content, attrs = {}, parent = null) {
    const el = createSvgEl('text', { x, y, ...attrs }, parent);
    el.textContent = content;
    return el;
  }

  /** 多行文本（SVG 没有自动换行，这里手动按行拆 <tspan>） */
  multilineText(x, y, lines, { lineHeight = 26, attrs = {}, parent = null } = {}) {
    const el = createSvgEl('text', { x, y, ...attrs }, parent);
    lines.forEach((line, i) => {
      const tspan = createSvgEl('tspan', { x, dy: i === 0 ? 0 : lineHeight }, el);
      tspan.textContent = line;
    });
    return el;
  }

  // ---------------------------------------------------------------- 更新工具

  /** 只在值变化时写属性（每帧调用也安全） */
  setAttr(el, name, value) {
    if (!el) return;
    const str = value === null || value === undefined ? '' : String(value);
    if (el.getAttribute(name) !== str) el.setAttribute(name, str);
  }

  setAttrs(el, attrs = {}) {
    for (const [key, value] of Object.entries(attrs)) this.setAttr(el, key, value);
  }

  /** 开关一个 class */
  setClass(el, className, on) {
    if (!el) return;
    if (on) el.classList.add(className);
    else el.classList.remove(className);
  }

  setText(el, content) {
    if (!el) return;
    const str = String(content);
    if (el.textContent !== str) el.textContent = str;
  }

  /** 显隐（用 CSS class 控制，方便配 transition） */
  setVisible(el, visible) {
    this.setClass(el, 'is-hidden', !visible);
  }

  // ---------------------------------------------------------------- 坐标换算

  /**
   * 把鼠标/触摸事件换算成 viewBox 逻辑坐标。
   * 因为 #game 固定 1280x720、SVG 用 viewBox 等比缩放，这里按包围盒线性换算即可，
   * 保证「点到的」和「看到的」完全一致。
   */
  toLocal(event) {
    const rect = this.root.getBoundingClientRect();
    const clientX = event.clientX ?? (event.touches && event.touches[0]?.clientX) ?? 0;
    const clientY = event.clientY ?? (event.touches && event.touches[0]?.clientY) ?? 0;
    const scaleX = rect.width > 0 ? this.width / rect.width : 1;
    const scaleY = rect.height > 0 ? this.height / rect.height : 1;
    return {
      x: (clientX - rect.left) * scaleX,
      y: (clientY - rect.top) * scaleY
    };
  }

  destroy() {
    for (const name of Array.from(this.layers.keys())) this.removeLayer(name);

    ctx.fillStyle = shade(base, 0.9 + lit * 0.5);
    // 鸡冠
    for (let i = -1; i <= 1; i++) {
      ctx.beginPath();
      ctx.moveTo(cx + i * r * 0.3 - r * 0.14, cy - r * 0.78);
      ctx.lineTo(cx + i * r * 0.3, cy - r * 1.25 - Math.abs(i) * r * 0.1);
      ctx.lineTo(cx + i * r * 0.3 + r * 0.14, cy - r * 0.78);
      ctx.closePath();
      ctx.fill();
    }
    // 喙
    ctx.fillStyle = '#e8a33d';
    ctx.beginPath();
    ctx.moveTo(cx - r * 0.32, cy + r * 0.3);
    ctx.lineTo(cx + r * 0.32, cy + r * 0.3);
    ctx.lineTo(cx, cy + r * 0.78);
    ctx.closePath();
    ctx.fill();
  } else if (shape === 'fox') {
    ctx.fillStyle = bodyColor;
    for (const sign of [-1, 1]) {
      ctx.beginPath();
      ctx.moveTo(cx + sign * r * 0.55, cy - r * 0.5);
      ctx.lineTo(cx + sign * r * 0.95, cy - r * 1.55);
      ctx.lineTo(cx + sign * r * 0.2, cy - r * 0.85);
      ctx.closePath();
      ctx.fill();
    }
    // 口鼻
    ctx.fillStyle = shade(accent, 1.8 + lit);
    ctx.beginPath();
    ctx.ellipse(cx, cy + r * 0.5, r * 0.4, r * 0.3, 0, 0, Math.PI * 2);
    ctx.fill();
    // 眼罩（右眼）
    ctx.fillStyle = shade(accent, 0.5);
    ctx.beginPath();
    ctx.ellipse(cx + r * 0.42, cy - r * 0.12, r * 0.34, r * 0.3, 0, 0, Math.PI * 2);
    ctx.fill();
  } else {
    // 熊：圆耳 + 礼帽 + 领结
    ctx.fillStyle = darkColor;
    for (const sign of [-1, 1]) {
      ctx.beginPath();
      ctx.arc(cx + sign * r * 0.75, cy - r * 0.62, r * 0.34, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.fillStyle = '#17151c';
    roundRect(ctx, cx - r * 0.62, cy - r * 1.62, r * 1.24, r * 0.42, r * 0.08);
    ctx.fill();
    roundRect(ctx, cx - r * 0.5, cy - r * 0.78 - r * 0.85, r * 1.0, r * 0.85, r * 0.1);
    ctx.fill();
    ctx.fillStyle = shade(accent, 1.4 + lit);
    ctx.beginPath();
    ctx.ellipse(cx, cy + r * 0.45, r * 0.42, r * 0.32, 0, 0, Math.PI * 2);
    ctx.fill();
  }
}

/** 嘴与牙齿 */
function drawMouth(ctx, def, { cx, cy, r, open, lit }) {
  const w = r * 0.86;
  const h = r * 0.42 * (0.5 + open);
  ctx.save();
  ctx.fillStyle = '#0b0709';
  ctx.beginPath();
  ctx.ellipse(cx, cy, w * 0.6, h, 0, 0, Math.PI * 2);
  ctx.fill();

  // 锯齿牙
  const teeth = 7;
  ctx.fillStyle = `rgba(238, 238, 226, ${0.55 + lit * 0.4})`;
  for (let i = 0; i < teeth; i++) {
    const tx = cx - w * 0.55 + (i / (teeth - 1)) * w * 1.1;
    const th = h * 0.85;
    ctx.beginPath();
    ctx.moveTo(tx - w * 0.07, cy - h * 0.95);
    ctx.lineTo(tx + w * 0.07, cy - h * 0.95);
    ctx.lineTo(tx, cy - h * 0.95 + th);
    ctx.closePath();
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(tx - w * 0.07, cy + h * 0.95);
    ctx.lineTo(tx + w * 0.07, cy + h * 0.95);
    ctx.lineTo(tx, cy + h * 0.95 - th);
    ctx.closePath();
    ctx.fill();
  }
  ctx.restore();
}

/**
 * 画一张正脸大特写（Jump Scare 用）。
 * @param {CanvasRenderingContext2D} ctx
 * @param {object} def 玩偶定义
 * @param {object} opts
 * @param {number} opts.cx 中心 x
 * @param {number} opts.cy 中心 y
 * @param {number} opts.size 脸的直径
 * @param {number} [opts.time]
 * @param {number} [opts.mouthOpen=1]
 */
function drawAnimatronicFace(ctx, def, { cx, cy, size, time = 0, mouthOpen = 1 } = {}) {
  const r = size / 2;
  const jitterX = (Math.random() - 0.5) * r * 0.06;
  const jitterY = (Math.random() - 0.5) * r * 0.06;
  ctx.save();
  ctx.translate(cx + jitterX, cy + jitterY);

  const base = def.color || '#9a9a9a';
  const accent = def.accent || '#333';
  const eyeColor = def.eyeColor || '#fff2b0';

  // 耳朵/帽子
  drawHeadFeatures(ctx, def, { cx: 0, cy: 0, r, lit: 1, time });

  // 头
  const grad = ctx.createRadialGradient(-r * 0.25, -r * 0.3, r * 0.1, 0, 0, r);
  grad.addColorStop(0, shade(base, 1.15));
  grad.addColorStop(0.7, shade(base, 0.75));
  grad.addColorStop(1, shade(base, 0.35));
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.arc(0, 0, r, 0, Math.PI * 2);
  ctx.fill();

  // 眼窝
  for (const sign of [-1, 1]) {
    const ex = sign * r * 0.42;
    const ey = -r * 0.1;
    ctx.fillStyle = 'rgba(6,5,8,0.95)';
    ctx.beginPath();
    ctx.ellipse(ex, ey, r * 0.24, r * 0.28, 0, 0, Math.PI * 2);
    ctx.fill();

    const glow = ctx.createRadialGradient(ex, ey, 0, ex, ey, r * 0.6);
    glow.addColorStop(0, withAlpha(eyeColor, 1));
    glow.addColorStop(0.25, withAlpha(eyeColor, 0.55));
    glow.addColorStop(1, withAlpha(eyeColor, 0));
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(ex, ey, r * 0.6, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = withAlpha(eyeColor, 1);
    ctx.beginPath();
    ctx.arc(ex + Math.sin(time * 9) * r * 0.02, ey, r * 0.13, 0, Math.PI * 2);
    ctx.fill();
  }

  // 嘴
  drawMouth(ctx, def, { cx: 0, cy: r * 0.52, r, open: mouthOpen, lit: 1 });

  // 边缘暗角，让它更「贴脸」
  const vignette = ctx.createRadialGradient(0, 0, r * 0.55, 0, 0, r * 1.15);
  vignette.addColorStop(0, 'rgba(0,0,0,0)');
  vignette.addColorStop(1, 'rgba(0,0,0,0.75)');
  ctx.fillStyle = vignette;
  ctx.beginPath();
  ctx.arc(0, 0, r * 1.15, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();
}

/** 圆角矩形路径（不用 ctx.roundRect，兼容性更好） */
function roundRect(ctx, x, y, w, h, r) {
  const radius = Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2);
  ctx.beginPath();
  ctx.moveTo(x + radius, y);
  ctx.arcTo(x + w, y, x + w, y + h, radius);
  ctx.arcTo(x + w, y + h, x, y + h, radius);
  ctx.arcTo(x, y + h, x, y, radius);
  ctx.arcTo(x, y, x + w, y, radius);
  ctx.closePath();
}

// ---------------------------------------------------------------- 渲染器主体

class CanvasRenderer {
  /**
   * @param {object} deps
   * @param {import('./LayerManager.js').default} deps.layers
   * @param {import('../entities/Room.js').RoomGraph} deps.graph
   */
  constructor({ layers, graph }) {
    this.layers = layers;
    this.graph = graph;
    /** @type {Map<string, HTMLImageElement>} view -> 可选贴图覆盖 */
    this.roomImages = new Map();
    this.time = 0;
    /**
     * 左右走廊的灯光亮度（0~1 的连续值）。
     * 不直接用布尔值：灯亮/灭如果是瞬间切换，看起来会很廉价，
     * 这里每帧向目标值平滑逼近，做出「灯管亮起来 / 熄灭」的过渡。
     */
    this.lightMix = { left: 0, right: 0 };
  }

  /** 尝试加载可选房间贴图；失败静默（没有贴图就用程序化绘制） */
  async loadRoomImages(views, base = './assets/images/rooms/') {
    await Promise.all(
      views.map(
        (view) =>
          new Promise((resolve) => {
            const img = new Image();
            img.onload = () => {
              this.roomImages.set(view, img);
              resolve();
            };
            img.onerror = () => resolve();
            img.src = `${base}${view}.png`;
          })
      )
    );
  }

  update(dt) {
    this.time += dt;
  }

  // ------------------------------------------------------------ 办公室视图

  /**
   * 画办公室的「透明部分」：门洞外的走廊 + 门口站着的玩偶。
   * SVG 里的办公室墙面是镂空的，这里画的内容正好从门洞透出来。
   *
   * @param {CanvasRenderingContext2D} ctx
   * @param {object} p
   * @param {number} p.dt 帧间隔（灯光过渡用）
   * @param {number} p.panOffset 水平位移（与 SVG 办公室组用同一个值）
   * @param {object} p.layout OFFICE_LAYOUT
   * @param {import('../systems/DoorSystem.js').default} p.doors
   * @param {Array<import('../ai/Animatronic.js').default>} p.animatronics
   * @param {boolean} p.powerOut
   */
  drawOffice(ctx, { dt = 0.016, panOffset, layout, doors, animatronics, powerOut = false }) {
    ctx.save();
    ctx.translate(panOffset, 0);

    for (const side of ['left', 'right']) {
      const rect = layout.doorways[side];
      const occupant = animatronics.find((a) => a.isAtDoor && a.doorSide === side) || null;

      // 目标亮度：灯开着且没停电 = 1，否则 0；停电时彻底黑
      const target = doors.isLightOn(side) && !powerOut ? 1 : 0;
      this.lightMix[side] = damp(this.lightMix[side], target, 11, dt);
      const light = powerOut ? 0 : this.lightMix[side];

      ctx.save();
      ctx.beginPath();
      ctx.rect(rect.x, rect.y, rect.w, rect.h);
      ctx.clip();

      this._drawCorridor(ctx, rect, { side, light, time: this.time });

      if (occupant && !powerOut) {
        const anchorX = rect.x + rect.w * 0.5;
        const groundY = rect.y + rect.h * 0.94;
        if (light > 0.25) {
          // 开灯：看清是谁站在门口（亮度跟着灯一起过渡）
          drawAnimatronicFigure(ctx, occupant.def, {
            x: anchorX,
            y: groundY,
            height: rect.h * 0.82,
            time: this.time,
            lit: 0.35 + light * 0.65
          });
        } else {
          // 关灯：只能看到两点眼睛（停留越久越明显，给玩家一点公平的提示）
          const visibleFor = occupant.doorTimer || 0;
          const alpha = clamp((visibleFor - 1.2) / 2.5, 0, 1) * 0.75;
          if (alpha > 0.02) {
            ctx.globalAlpha = alpha;
            drawAnimatronicFigure(ctx, occupant.def, {
              x: anchorX,
              y: groundY,
              height: rect.h * 0.82,
              time: this.time,
              lit: 0.2,
              eyesOnly: true
            });
            ctx.globalAlpha = 1;
          }
        }
      }

      if (powerOut) {
        // 停电：门洞里一片黑，只偶尔闪一下另一张脸
        ctx.fillStyle = 'rgba(0,0,0,0.93)';
        ctx.fillRect(rect.x, rect.y, rect.w, rect.h);
        const flicker = Math.sin(this.time * 13.7) > 0.86 || Math.sin(this.time * 5.3) > 0.97;
        if (flicker && side === layout.powerOutSide) {
          ctx.globalAlpha = 0.35;
          drawAnimatronicFace(ctx, layout.powerOutDef || { shape: 'bear', color: '#c9a227' }, {
            cx: rect.x + rect.w * 0.5,
            cy: rect.y + rect.h * 0.55,
            size: rect.w * 0.9,
            time: this.time,
            mouthOpen: 0.6
          });
          ctx.globalAlpha = 1;
        }
      }

      ctx.restore();
    }

    ctx.restore();
  }

  /**
   * 门洞外的走廊（透视）。
   * @param {number} light 0 = 全黑，1 = 灯全亮。所有颜色都在两个极端之间插值。
   */
  _drawCorridor(ctx, rect, { side, light = 0, time = 0 }) {
    const { x, y, w, h } = rect;
    const vanishX = side === 'left' ? x + w * 1.5 : x - w * 0.5;
    const L = clamp(light, 0, 1);

    // 墙面：关灯是近乎全黑，开灯是昏黄的旧走廊
    const wallGrad = ctx.createLinearGradient(x, y, x, y + h);
    wallGrad.addColorStop(0, mix('#0b0c11', '#9a8f70', L));
    wallGrad.addColorStop(0.55, mix('#07080c', '#655b45', L));
    wallGrad.addColorStop(1, mix('#040508', '#2e281b', L));
    ctx.fillStyle = wallGrad;
    ctx.fillRect(x, y, w, h);

    // 地面透视
    const floorY = y + h * 0.55;
    ctx.fillStyle = mix('#07080b', '#3a3428', L);
    ctx.beginPath();
    ctx.moveTo(x, floorY);
    ctx.lineTo(x + w, floorY);
    ctx.lineTo(vanishX, y + h * 0.78);
    ctx.lineTo(vanishX, y + h * 0.62);
    ctx.closePath();
    ctx.fill();

    // 透视网格线
    ctx.strokeStyle = `rgba(226, 214, 184, ${0.02 + L * 0.22})`;
    ctx.lineWidth = 1.5;
    for (let i = 1; i <= 5; i++) {
      const t = i / 6;
      ctx.beginPath();
      ctx.moveTo(x + w * t, y + h * 0.62);
      ctx.lineTo(x + w * t, y + h);
      ctx.stroke();
    }
    for (let i = 1; i <= 4; i++) {
      const t = i / 5;
      const ly = y + h * (0.62 + t * 0.38);
      ctx.beginPath();
      ctx.moveTo(x + w * 0.08 * t, ly);
      ctx.lineTo(x + w * (1 - 0.08 * t), ly);
      ctx.stroke();
    }

    // 走廊尽头的门
    const doorW = w * 0.22;
    const doorH = h * 0.3;
    const dx = side === 'left' ? x + w * 0.62 : x + w * 0.16;
    const dy = y + h * 0.34;
    ctx.fillStyle = mix('#0a0b0f', '#2c261c', L);
    ctx.fillRect(dx, dy, doorW, doorH);
    ctx.strokeStyle = `rgba(196, 176, 128, ${0.05 + L * 0.4})`;
    ctx.lineWidth = 2;
    ctx.strokeRect(dx, dy, doorW, doorH);

    // 天花板灯管（开灯时才存在）
    if (L > 0.02) {
      ctx.globalAlpha = L;
      const glow = ctx.createRadialGradient(x + w * 0.5, y + h * 0.1, 4, x + w * 0.5, y + h * 0.1, w * 0.95);
      glow.addColorStop(0, 'rgba(255, 244, 205, 0.75)');
      glow.addColorStop(1, 'rgba(255, 244, 205, 0)');
      ctx.fillStyle = glow;
      ctx.fillRect(x, y, w, h);

      ctx.fillStyle = 'rgba(255, 250, 226, 0.9)';
      ctx.fillRect(x + w * 0.3, y + h * 0.055, w * 0.4, 7);

      // 灯管的轻微抖动
      const flicker = 0.9 + Math.sin(time * 27) * 0.05 + Math.sin(time * 61) * 0.04;
      ctx.fillStyle = `rgba(0, 0, 0, ${clamp(1 - flicker, 0, 0.35)})`;
      ctx.fillRect(x, y, w, h);
      ctx.globalAlpha = 1;
    } else {
      // 全黑时保留一点点「有东西在动」的呼吸感
      ctx.fillStyle = `rgba(0,0,0,${0.35 + Math.sin(time * 1.6) * 0.06})`;
      ctx.fillRect(x, y, w, h);
    }
  }

  // ------------------------------------------------------------ 监控画面

  /**
   * 画监控画面（会被裁剪到监控屏幕矩形内）。
   * @param {CanvasRenderingContext2D} ctx
   * @param {object} p
   * @param {{x:number,y:number,w:number,h:number}} p.rect 画面区域（由 ui/CameraPanel.js 提供，保证与 SVG 边框一致）
   * @param {import('../entities/Room.js').Room} p.room
   * @param {Array<import('../ai/Animatronic.js').default>} p.animatronics
   */
  drawMonitor(ctx, { rect, room, animatronics, camerasOn }) {
    if (!room) return;
    ctx.save();
    ctx.beginPath();
    ctx.rect(rect.x, rect.y, rect.w, rect.h);
    ctx.clip();

    if (!camerasOn) {
      ctx.fillStyle = '#040507';
      ctx.fillRect(rect.x, rect.y, rect.w, rect.h);
      ctx.restore();
      return;
    }

    const image = this.roomImages.get(room.view);
    if (image) {
      // 有贴图就铺满（cover）
      const scale = Math.max(rect.w / image.width, rect.h / image.height);
      const dw = image.width * scale;
      const dh = image.height * scale;
      ctx.globalAlpha = 0.95;
      ctx.drawImage(image, rect.x + (rect.w - dw) / 2, rect.y + (rect.h - dh) / 2, dw, dh);
      ctx.globalAlpha = 1;
    } else {
      this._drawRoomRecipe(ctx, rect, room);
    }

    // 房间里的玩偶
    for (const a of animatronics) {
      if (a.roomId !== room.id) continue;
      this._drawRoomOccupant(ctx, rect, room, a);
    }

    // 房间自带的压迫感：轻微暗角
    const vignette = ctx.createRadialGradient(
      rect.x + rect.w / 2, rect.y + rect.h / 2, rect.h * 0.3,
      rect.x + rect.w / 2, rect.y + rect.h / 2, rect.h * 0.85
    );
    vignette.addColorStop(0, 'rgba(0,0,0,0)');
    vignette.addColorStop(1, 'rgba(0,0,0,0.6)');
    ctx.fillStyle = vignette;
    ctx.fillRect(rect.x, rect.y, rect.w, rect.h);

    ctx.restore();
  }

  /** 房间画面配方：按 rooms.json 的 view 字段选画法 */
  _drawRoomRecipe(ctx, rect, room) {
    switch (room.view) {
      case 'stage': return this._roomStage(ctx, rect);
      case 'dining': return this._roomDining(ctx, rect);
      case 'backstage': return this._roomBackstage(ctx, rect);
      case 'cove': return this._roomCove(ctx, rect, room);
      case 'hall': return this._roomHall(ctx, rect, room);
      case 'corner': return this._roomCorner(ctx, rect, room);
      case 'closet': return this._roomCloset(ctx, rect);
      case 'restroom': return this._roomRestroom(ctx, rect);
      case 'kitchen': return this._roomKitchen(ctx, rect);
      default: return this._roomHall(ctx, rect, room);
    }
  }

  /** 房间里的玩偶：站在地面上的站位由房间类型决定 */
  _drawRoomOccupant(ctx, rect, room, animatronic) {
    const spots = {
      stage: [{ x: 0.3, y: 0.86 }, { x: 0.5, y: 0.84 }, { x: 0.7, y: 0.86 }],
      dining: [{ x: 0.35, y: 0.92 }, { x: 0.62, y: 0.9 }, { x: 0.5, y: 0.88 }],
      cove: [{ x: 0.5, y: 0.9 }],
      hall: [{ x: 0.5, y: 0.95 }],
      corner: [{ x: 0.45, y: 0.95 }],
      closet: [{ x: 0.5, y: 0.98 }],
      restroom: [{ x: 0.5, y: 0.95 }],
      kitchen: [{ x: 0.5, y: 0.95 }],
      backstage: [{ x: 0.5, y: 0.95 }]
    };
    const list = spots[room.view] || spots.hall;
    // 用 id 的哈希决定站位，保证同一只玩偶在同一房间的位置稳定
    const hash = Array.from(animatronic.def.id).reduce((sum, c) => sum + c.charCodeAt(0), 0);
    const spot = list[hash % list.length];

    const x = rect.x + rect.w * spot.x;
    const y = rect.y + rect.h * spot.y;
    const height = rect.h * (room.view === 'stage' ? 0.44 : 0.62);

    drawAnimatronicFigure(ctx, animatronic.def, { x, y, height, time: this.time, lit: 0.85 });
  }

  _roomBase(ctx, rect, { wallTop = '#2a2c34', wallBottom = '#15161b', floor = '#1b1c22' } = {}) {
    const grad = ctx.createLinearGradient(rect.x, rect.y, rect.x, rect.y + rect.h);
    grad.addColorStop(0, wallTop);
    grad.addColorStop(0.62, wallBottom);
    ctx.fillStyle = grad;
    ctx.fillRect(rect.x, rect.y, rect.w, rect.h);
    ctx.fillStyle = floor;
    ctx.fillRect(rect.x, rect.y + rect.h * 0.68, rect.w, rect.h * 0.32);

    // 棋盘地砖
    const tile = rect.h * 0.08;
    ctx.save();
    ctx.beginPath();
    ctx.rect(rect.x, rect.y + rect.h * 0.68, rect.w, rect.h * 0.32);
    ctx.clip();
    for (let iy = 0; iy < 6; iy++) {
      for (let ix = 0; ix < 24; ix++) {
        if ((ix + iy) % 2 === 0) continue;
        ctx.fillStyle = 'rgba(255,255,255,0.045)';
        ctx.fillRect(rect.x + ix * tile, rect.y + rect.h * 0.68 + iy * tile * 0.7, tile, tile * 0.7);
      }
    }
    ctx.restore();
  }

  _roomStage(ctx, rect) {
    this._roomBase(ctx, rect, { wallTop: '#241a2c', wallBottom: '#120d18', floor: '#191320' });
    // 舞台
    ctx.fillStyle = '#2c1c2a';
    ctx.fillRect(rect.x + rect.w * 0.12, rect.y + rect.h * 0.5, rect.w * 0.76, rect.h * 0.2);
    // 幕布
    ctx.fillStyle = '#4a1030';
    for (let i = 0; i < 10; i++) {
      ctx.fillRect(rect.x + rect.w * 0.12 + i * (rect.w * 0.076), rect.y + rect.h * 0.12, rect.w * 0.038, rect.h * 0.4);
    }
    // 射灯
    for (const sx of [0.2, 0.5, 0.8]) {
      const g = ctx.createRadialGradient(rect.x + rect.w * sx, rect.y + rect.h * 0.16, 2, rect.x + rect.w * sx, rect.y + rect.h * 0.16, rect.h * 0.5);
      g.addColorStop(0, 'rgba(255, 235, 180, 0.35)');
      g.addColorStop(1, 'rgba(255, 235, 180, 0)');
      ctx.fillStyle = g;
      ctx.fillRect(rect.x, rect.y, rect.w, rect.h * 0.8);
    }
  }

  _roomDining(ctx, rect) {

        stroke: 'rgba(0,0,0,0.55)',
        'stroke-width': 3
      }, group);
    }

    // --- 门面板（symbol 定义一次，两扇门各自 <use> 复用）
    //     注意：不要用「镜像组」偷懒 —— 镜像会把 use 的 x 也翻过去，
    //     结果右门板会画到左门洞上、右门永远看起来是开着的。
    this._defineDoorPanelSymbol();
    this.doorPanels = {};
    for (const side of ['left', 'right']) {
      const d = L.doorways[side];
      const g = r.group({ class: 'door-panel-group', 'data-side': side }, group);
      const use = r.use('door-panel', {
        x: d.x - L.doorPanel.inset,
        y: d.y - L.doorPanel.inset,
        width: d.w + L.doorPanel.inset * 2,
        height: d.h + L.doorPanel.inset * 2,
        color: '#c9d3dd'
      }, g);
      g.style.transform = `translateY(${-L.doorPanel.travel}px)`;   // 默认开启
      this.doorPanels[side] = { group: g, use };
    }

    // --- 桌面与桌面道具
    const desk = L.desk;
    r.rect(desk.x, desk.y, desk.w, desk.h, {
      rx: 10,
      fill: r.addLinearGradient('office-desk', [
        { offset: 0, color: '#3a2f24' },
        { offset: 0.15, color: '#241d16' },
        { offset: 1, color: '#120e0a' }
      ]),
      stroke: 'rgba(0,0,0,0.6)',
      'stroke-width': 2
    }, group);

    // 桌上的显示器（黑屏，只是陈设）
    r.rect(desk.x + 70, desk.y - 78, 200, 96, { rx: 6, fill: '#0a0b0e', stroke: '#2b2f36', 'stroke-width': 3 }, group);
    r.rect(desk.x + 84, desk.y - 64, 172, 68, { rx: 3, fill: '#05070a' }, group);
    r.rect(desk.x + 156, desk.y - 4, 28, 14, { fill: '#2b2f36' }, group);

    // 便签与杯子
    r.rect(desk.x + 300, desk.y + 16, 120, 66, { rx: 4, fill: '#d8d2bd', opacity: 0.75, transform: 'rotate(-4 360 640)' }, group);
    for (let i = 0; i < 4; i++) {
      r.line(desk.x + 312, desk.y + 30 + i * 12, desk.x + 400 - i * 12, desk.y + 30 + i * 12,
        { stroke: 'rgba(40, 40, 40, 0.5)', 'stroke-width': 2 }, group);
    }
    r.path(`M${desk.x + 470} ${desk.y + 20} h54 v40 a27 27 0 0 1 -54 0 z`, { fill: '#8c2f4a' }, group);
    // 桌上的纸杯蛋糕（FNAF 梗）
    r.path(`M${desk.x + 560} ${desk.y + 52} l8 -34 h32 l8 34 z`, { fill: '#d8b06a' }, group);
    r.circle(desk.x + 584, desk.y + 14, 14, { fill: '#e46a8a' }, group);
    r.circle(desk.x + 584, desk.y + 2, 6, { fill: '#c8102e' }, group);

    // --- 风扇（CSS 旋转动画）
    const fan = L.fan;
    r.circle(fan.cx, fan.cy, fan.r + 6, { fill: 'rgba(10,12,16,0.75)', stroke: '#3d434c', 'stroke-width': 3 }, group);
    const blades = r.group({ id: 'office-fan-blades' }, group);
    for (let i = 0; i < 4; i++) {
      const angle = (i * 90 * Math.PI) / 180;
      const x = fan.cx + Math.cos(angle) * fan.r * 0.5;
      const y = fan.cy + Math.sin(angle) * fan.r * 0.5;
      r.path(
        `M${fan.cx} ${fan.cy} L${x} ${y} L${fan.cx + Math.cos(angle + 0.5) * fan.r * 0.95} ${fan.cy + Math.sin(angle + 0.5) * fan.r * 0.95} Z`,
        { fill: 'rgba(190, 200, 215, 0.35)' },
        blades
      );
    }
    r.circle(fan.cx, fan.cy, 7, { fill: '#5b6270' }, group);
    r.rect(fan.cx - 6, fan.cy + fan.r, 12, 60, { fill: '#2b2f36' }, group);

    // --- 后墙装饰：海报 / 通风口 / 时钟
    this._buildPoster(group, 420, 150);
    this._buildPoster(group, 720, 150);
    r.rect(540, 320, 200, 130, { rx: 6, fill: '#15171c', stroke: '#3a3f48', 'stroke-width': 3 }, group);
    for (let i = 0; i < 6; i++) {
      r.line(552, 336 + i * 20, 728, 336 + i * 20, { stroke: 'rgba(150, 160, 180, 0.22)', 'stroke-width': 4 }, group);
    }

    // --- 暗角与鼠标热区：**不能**跟着转头平移**（否则暗角会像贴在墙上一样乱跑），
    //     所以单独放在不平移的 office-input 图层；这一层在墙之上、按钮之下。
    const inputLayer = r.layer('office-input', 15);
    this.officeInputLayer = inputLayer;

    const vignette = r.addRadialGradient('office-vignette', [
      { offset: 0.45, color: '#000000', opacity: 0 },
      { offset: 1, color: '#000000', opacity: 0.75 }
    ], { cx: 0.5, cy: 0.5, r: 0.72 });
    r.rect(0, 0, 1280, 720, { fill: vignette, 'pointer-events': 'none' }, inputLayer);

    const hitbox = r.rect(0, 0, 1280, 720, {
      fill: 'transparent',
      'pointer-events': 'all',
      class: 'office-hitbox',
      id: 'office-hitbox'
    }, inputLayer);
    hitbox.addEventListener('pointermove', (event) => {
      if (this.state !== 'active' && this.state !== 'intro') return;
      // 手机模式下用手指拖动不应该转头（交给两侧的大箭头按钮），
      // 否则拖动会和触摸操作的意图打架。
      if (this.services.mobile.enabled) return;
      const local = this.renderer.toLocal(event);
      this.services.session.player.lookByPointer(clamp(local.x / 1280, 0, 1));
    });
  }

  /**
   * 侧墙细节：管道、配电箱、通风口、踢脚线。
   * 这些只在「转头看向那一侧」时进入画面，用来提供移动参照物 ——
   * 没有它们的话，平移看起来就像整张贴图在滑动。
   * 布局按可用跨度等比摆放，所以左右两侧共用同一份代码。
   */
  _buildSideWallProps(parent, fromX, toX) {
    const r = this.renderer;
    const span = toX - fromX;

    // 竖直管道
    for (const offset of [0.06, 0.13]) {
      r.rect(fromX + span * offset, 46, 14, 554, {
        fill: '#1d2027', stroke: 'rgba(120, 132, 150, 0.25)', 'stroke-width': 2
      }, parent);
    }
    for (let i = 0; i < 5; i++) {
      r.rect(fromX + span * 0.06 - 6, 96 + i * 108, 26, 10, { rx: 3, fill: '#2c313a' }, parent);
    }

    // 配电箱
    const boxX = fromX + span * 0.26;
    r.rect(boxX, 230, 118, 150, { rx: 5, fill: '#232830', stroke: '#454c58', 'stroke-width': 3 }, parent);
    r.rect(boxX + 14, 244, 90, 44, { rx: 3, fill: '#12161c' }, parent);
    r.circle(boxX + 59, 310, 9, { fill: '#c8102e', opacity: 0.8 }, parent);
    r.path(`M${boxX + 10} 340 l22 -30 h18 l-22 30 z`, { fill: '#d8c04a', opacity: 0.75 }, parent);
    r.path(`M${boxX + 40} 340 l22 -30 h18 l-22 30 z`, { fill: '#d8c04a', opacity: 0.55 }, parent);

    // 通风口
    const ventX = fromX + span * 0.58;
    r.rect(ventX, 150, 150, 104, { rx: 4, fill: '#171a20', stroke: '#3a4048', 'stroke-width': 3 }, parent);
    for (let i = 0; i < 5; i++) {
      r.line(ventX + 12, 166 + i * 18, ventX + 138, 166 + i * 18,
        { stroke: 'rgba(150, 160, 180, 0.25)', 'stroke-width': 4 }, parent);
    }

    // 踢脚线：转头时最明显的移动参照
    r.rect(fromX, 578, span, 22, { fill: 'rgba(60, 66, 78, 0.55)' }, parent);
  }

  /** 门板 symbol：金属门 + 观察窗 + 警示条 */
  _defineDoorPanelSymbol() {
    const r = this.renderer;
    r.addSymbol('door-panel', '0 0 262 492', (symbol) => {
      r.rect(0, 0, 262, 492, { rx: 4, fill: '#2f343d', stroke: '#5e6672', 'stroke-width': 4 }, symbol);
      // 横向加强筋
      for (let i = 0; i < 5; i++) {
        r.rect(14, 54 + i * 76, 234, 16, { rx: 3, fill: 'rgba(255,255,255,0.06)' }, symbol);
      }
      // 观察窗
      r.rect(76, 20, 110, 30, { rx: 4, fill: 'rgba(10, 14, 20, 0.9)', stroke: 'rgba(200, 215, 235, 0.35)', 'stroke-width': 3 }, symbol);
      // 警示条
      r.rect(14, 436, 234, 26, { fill: '#6b5a10' }, symbol);
      for (let i = 0; i < 9; i++) {
        r.path(`M${14 + i * 26} 462 l13 -26 h13 l-13 26 z`, { fill: '#d8c04a' }, symbol);
      }
      // 铆钉
      for (const [x, y] of [[10, 10], [252, 10], [10, 482], [252, 482]]) {
        r.circle(x, y, 4, { fill: 'rgba(220, 230, 240, 0.5)' }, symbol);
      }
    });
  }

  /** 墙上海报（用玩偶头像 symbol 复用） */
  _buildPoster(parent, x, y) {
    const r = this.renderer;
    if (!r.hasSymbol('poster-face')) {
      r.addSymbol('poster-face', '0 0 100 100', (symbol) => {
        r.circle(50, 44, 30, { fill: 'none', stroke: 'currentColor', 'stroke-width': 4 }, symbol);
        r.circle(36, 42, 6, { fill: 'none', stroke: 'currentColor', 'stroke-width': 3 }, symbol);
        r.circle(46, 30, 6, { fill: 'none', stroke: 'currentColor', 'stroke-width': 3 }, symbol);
        r.path('M20 30 q10 -18 30 -20 q20 2 30 20', { fill: 'none', stroke: 'currentColor', 'stroke-width': 4 }, symbol);
        r.path('M36 58 q14 10 28 0', { fill: 'none', stroke: 'currentColor', 'stroke-width': 4 }, symbol);
      });
    }
    const g = r.group({}, parent);
    r.rect(x, y, 160, 200, { rx: 3, fill: '#c8b98d', opacity: 0.9 }, g);
    r.rect(x + 8, y + 8, 144, 184, { fill: 'none', stroke: 'rgba(60, 50, 30, 0.5)', 'stroke-width': 2 }, g);
    r.use('poster-face', {
      x: x + 20, y: y + 26, width: 120, height: 120, color: 'rgba(70, 50, 40, 0.85)'
    }, g);
    r.text(x + 80, y + 180, 'CELEBRATE!', {
      'text-anchor': 'middle', fill: 'rgba(70, 50, 40, 0.85)', 'font-size': 18,
      'font-family': '"Trebuchet MS", sans-serif', 'letter-spacing': 1
    }, g);
  }

  /** HUD：门/灯按钮、电力条、时间、监控面板、（可选）手机触控按钮 */
  _buildHud() {
    const r = this.renderer;
    const L = OFFICE_LAYOUT;
    const uiLayer = r.layer('office-ui', 20);
    this.officeUiLayer = uiLayer;
    const camLayer = r.layer('camera', 30);
    // HUD 必须压在监控面板之上：打开监控时电力条/时间仍然要看得见（和原版一致），
    // 而监控面板的边框是一张铺满屏幕的 evenodd 路径，放在下层会被它整个遮住。
    const hudLayer = r.layer('hud', 35);
    // 手机触控按钮在最上层（监控面板之上），否则监控模式下按钮点不到
    const touchLayer = r.layer('touch', 45);

    // 门/灯按钮（左右各一组）
    this.doorButtons = [];
    for (const side of ['left', 'right']) {
      const pos = L.buttons[side];
      this.doorButtons.push(new DoorButton({
        renderer: r,
        parent: uiLayer,
        side,
        x: pos.x,
        y: pos.y,
        size: 88,
        gap: 16,
        callbacks: {
          onToggleDoor: (s) => this._toggleDoor(s),
          onToggleLight: (s) => this._toggleLight(s),
          onDenied: () => this.audio.play('denied', { gain: 0.8 })
        }
      }));
    }

    this.powerBar = new PowerBar({ renderer: r, parent: hudLayer, x: 34, y: 620, width: 322 });
    this.timeDisplay = new TimeDisplay({ renderer: r, parent: hudLayer });
    this.cameraPanel = new CameraPanel({
      renderer: r,
      parent: camLayer,
      graph: this.services.graph,
      callbacks: {
        onSelect: (roomId) => this._selectCamera(roomId),
        onClose: () => this._setMonitor(false)
      }
    });

    // 手机模式的屏幕触控按钮（关闭时整组隐藏，电脑上完全看不到）
    this.touchControls = new TouchControls({
      renderer: r,
      parent: touchLayer,
      callbacks: {
        onLook: (dir) => (dir < 0 ? this.session.player.lookLeft() : this.session.player.lookRight()),
        onRecenter: () => this.session.player.lookCenter(),
        onDoor: (side) => this._toggleDoor(side),
        onLight: (side) => this._toggleLight(side),
        onToggleMonitor: () => this._setMonitor(!this.session.cameras.isOn),
        onPrevCamera: () => this._cycleCamera(-1),
        onNextCamera: () => this._cycleCamera(1)
      }
    });
    this.touchControls.setEnabled(this.services.mobile.enabled);

    // 操作提示（左下角，几秒后淡出）：文案随操作方式变化
    const mobileHint = '点两侧箭头转头 · 底部按钮开关门灯 · 监控按钮看摄像头';
    const desktopHint = 'A/D 转头 · Q/E 关门 · Z/C 开灯 · SPACE 监控 · 1-9 切摄像头';
    this.hintEl = r.text(34, 706, this.services.mobile.enabled ? mobileHint : desktopHint, {
      fill: 'rgba(200, 215, 235, 0.5)',
      'font-size': 14,
      class: 'hud-hint'
    }, hudLayer);
  }

  /** 开场提示卡 */
  _showIntroCard() {
    const r = this.renderer;
    const overlay = r.layer('overlay', 50);
    this.overlayGroup = r.group({ id: 'office-overlay' }, overlay);

    r.rect(0, 0, 1280, 720, { fill: 'rgba(0,0,0,0.85)' }, this.overlayGroup);
    r.text(640, 300, '12:00 AM', {
      'text-anchor': 'middle', fill: '#e8eef7', 'font-size': 96, class: 'overlay-title'
    }, this.overlayGroup);
    r.text(640, 380, `Night ${this.night}`, {
      'text-anchor': 'middle', fill: '#9fb3c8', 'font-size': 40, class: 'overlay-title'
    }, this.overlayGroup);
    r.text(640, 470, '撑到 6:00 AM。别让电用光。', {
      'text-anchor': 'middle', fill: '#7f8fa3', 'font-size': 24, class: 'hud-hint'
    }, this.overlayGroup);
    r.text(640, 520, 'A/D 转头 · Q/E 关门 · Z/C 开灯 · SPACE 看监控', {
      'text-anchor': 'middle', fill: '#6b7a8c', 'font-size': 18, class: 'hud-hint'
    }, this.overlayGroup);
  }

  _hideOverlay() {
    if (!this.overlayGroup) return;
    this.renderer.setVisible(this.overlayGroup, false);
  }

  // ================================================================ 事件订阅

  _subscribe() {
    const s = this.session;
    const sub = (emitter, type, handler) => this._unsubs.push(emitter.on(type, handler));

    // --- 门 / 灯：同步电力来源 + 音效 + 门板动画
    sub(s.doors.events, 'door', ({ side, closed }) => {
      s.power.setSource(`${side}Door`, closed);
      this.audio.play(closed ? 'doorClose' : 'doorOpen', { gain: 0.9 });
      this._updateDoorPanel(side, closed);
    });
    sub(s.doors.events, 'light', ({ side, on }) => {
      s.power.setSource(`${side}Light`, on);
      this.audio.play('lightClick', { gain: 0.7 });
      this._updateLightBuzz();
    });
    sub(s.doors.events, 'denied', () => this.audio.play('denied', { gain: 0.9 }));

    // --- 监控：电力来源 + 音效 + 静电循环音
    sub(s.cameras.events, 'open', () => {
      s.power.setSource('cameras', true);
      this.audio.play('cameraOpen', { gain: 0.9 });
      this.audio.setLoopGain('static', 0.1);
    });
    sub(s.cameras.events, 'close', () => {
      s.power.setSource('cameras', false);
      this.audio.play('cameraClose', { gain: 0.8 });
      this.audio.setLoopGain('static', 0);
    });
    sub(s.cameras.events, 'changed', () => this.audio.play('cameraSwitch', { gain: 0.7 }));
    sub(s.cameras.events, 'denied', () => this.audio.play('denied', { gain: 0.9 }));

    // --- 电力耗尽 → 停电流程
    sub(s.power.events, 'depleted', () => this._onPowerOut());

    // --- 时间
    sub(s.time.events, 'hour', ({ hour, index }) => this._onHour(hour, index));
    sub(s.time.events, 'win', () => this._onWin());

    // --- 玩偶事件：音效与电力惩罚
    for (const a of s.animatronics) {
      sub(a.events, 'move', (data) => this._onAnimatronicMove(a, data));
      sub(a.events, 'arriveDoor', (data) => this._onArriveDoor(a, data));
      sub(a.events, 'rush', () => this.audio.play('run', { gain: 0.9 }));
      sub(a.events, 'blocked', (data) => this._onBlocked(a, data));
      sub(a.events, 'attack', () => this._onAttacked(a));
    }
  }

  // ================================================================ 输入

  _bindInput() {
    this._onKeyDown = (event) => this._handleKeyDown(event);
    this._onKeyUp = (event) => this._handleKeyUp(event);
    window.addEventListener('keydown', this._onKeyDown);
    window.addEventListener('keyup', this._onKeyUp);
  }

  _unbindInput() {
    window.removeEventListener('keydown', this._onKeyDown);
    window.removeEventListener('keyup', this._onKeyUp);
  }

  _handleKeyDown(event) {
    const key = event.key.toLowerCase();
    const player = this.session.player;

    switch (key) {
      case 'a':
      case 'arrowleft':
        this._keys.left = true;
        player.lookLeft();
        break;
      case 'd':
      case 'arrowright':
        this._keys.right = true;
        player.lookRight();
        break;
      case 's':
      case 'arrowdown':
        player.lookCenter();
        break;
      case 'q':
        this._toggleDoor('left');
        break;
      case 'e':
        this._toggleDoor('right');
        break;
      case 'z':
        this._toggleLight('left');
        break;
      case 'c':
        this._toggleLight('right');
        break;
      case ' ':
      case 'tab':
        event.preventDefault();
        this._setMonitor(!this.session.cameras.isOn);
        break;
      case 'escape':
        this.services.sceneManager.change('menu', { result: { kind: 'quit', night: this.night } });
        break;
      default:
        // 数字键 1-9 切换摄像头
        if (/^[1-9]$/.test(key)) {
          const list = this.session.cameras.cameras;
          const target = list[Number(key) - 1];
          if (target) this._selectCamera(target.id);
        }
    }
  }

  _handleKeyUp(event) {
    const key = event.key.toLowerCase();
    if (key === 'a' || key === 'arrowleft') this._keys.left = false;
    if (key === 'd' || key === 'arrowright') this._keys.right = false;
  }

  // ================================================================ 玩家动作

  /** 开关门：看监控时不允许操作门（和 FNAF1 一致，逼你在监控和门之间做选择） */
  _toggleDoor(side) {
    if (this.state === 'powerout' || this.state === 'win' || this.state === 'dead') return;
    if (this.session.cameras.isOn) {
      this.audio.play('denied', { gain: 0.8 });
      return;
    }
    this.session.doors.toggleDoor(side);
  }

  _toggleLight(side) {
    if (this.state === 'powerout' || this.state === 'win' || this.state === 'dead') return;
    if (this.session.cameras.isOn) {
      this.audio.play('denied', { gain: 0.8 });
      return;
    }
    this.session.doors.toggleLight(side);
  }

  _setMonitor(on) {
    if (this.state === 'powerout' || this.state === 'dead') return;
    const cameras = this.session.cameras;
    const changed = cameras.toggle(on, { powerOut: this.session.power.isDepleted });
    if (changed) {
      this.session.player.setMonitorOpen(cameras.isOn);
      // 打开监控时视角回到正中，避免和办公室转头角度错乱
      if (cameras.isOn) this.session.player.lookCenter();
    }
  }

  _selectCamera(roomId) {
    if (this.state === 'powerout' || this.state === 'dead') return;
    this.session.cameras.select(roomId, { powerOut: this.session.power.isDepleted });
    this.session.player.setMonitorOpen(this.session.cameras.isOn);
  }

  /** 手机模式的「上一台 / 下一台」摄像头 */
  _cycleCamera(step) {
    if (this.state === 'powerout' || this.state === 'dead') return;
    this.session.cameras.cycle(step, { powerOut: this.session.power.isDepleted });
    this.session.player.setMonitorOpen(this.session.cameras.isOn);
  }

  // ================================================================ 事件回调

  _updateDoorPanel(side, closed) {
    const panel = this.doorPanels?.[side];
    if (!panel) return;
    const travel = closed ? 0 : -OFFICE_LAYOUT.doorPanel.travel;
    panel.group.style.transform = `translateY(${travel}px)`;
  }

  _updateLightBuzz() {
    const on = this.session.doors.isLightOn('left') || this.session.doors.isLightOn('right');
    this.audio.setLoopGain('lightBuzz', on ? 0.045 : 0);
  }

  _onHour(hour, index) {
    // 整点提升难度（AILevel 的 hourRamp 生效）
    const { aiLevel, animatronics } = this.session;
    for (const a of animatronics) {
      a.setAILevel(aiLevel.levelFor(a.def.id, this.night, index));
    }
    this.audio.play('lightClick', { gain: 0.35 });   // 轻微的「时间跳了一格」提示
  }

  _onAnimatronicMove(a, data) {
    // 只有「在走廊/门口」的移动才给声音提示，且音量随机一点，避免变成雷达
    const room = this.services.graph.get(data.to);
    if (!room) return;
    const nearHall = room.hasTag('hall') || room.hasTag('door');

    idleDrainPerSecond: 0.09,  // usage 1 的耗电（%/秒）
    drainPerUsageLevel: 0.09   // 每多一级 usage 追加的耗电
  },
  doors: {
    lightAutoOffSeconds: 5     // 灯自动熄灭，防止忘关
  },
  cameras: {
    switchStatic: 0.85,
    staticDecay: 2.6
  },
  audio: {
    sampleBase: './assets/sounds/'
  },
  dataUrls: {
    rooms: './assets/data/rooms.json',
    animatronics: './assets/data/animatronics.json'
  }
};

// 立刻注入基础样式（模块脚本执行很快，避免黑屏前出现白闪）
injectStyle('fnaf-base-css', GAME_CSS);

// ------------------------------------------------------------------ DOM 容器

const dom = {
  container: document.getElementById('game'),
  fx: document.getElementById('fx'),
  scene: document.getElementById('scene'),
  ui: document.getElementById('ui')
};

if (!dom.container || !dom.fx || !dom.scene || !dom.ui) {
  throw new Error('[main] index.html 缺少 #game / #fx / #scene / #ui 容器');
}

// ------------------------------------------------------------------ 渲染层

const layers = new LayerManager({
  container: dom.container,
  fxCanvas: dom.fx,
  sceneCanvas: dom.scene,
  svg: dom.ui,
  width: GAME_CONFIG.logicalWidth,
  height: GAME_CONFIG.logicalHeight
});

const svgRenderer = new SVGRenderer(dom.ui, {
  width: GAME_CONFIG.logicalWidth,
  height: GAME_CONFIG.logicalHeight
});

// ------------------------------------------------------------------ 存档与设置

const save = new SaveSystem();
const settings = save.settings;

const audio = new AudioSystem({
  volume: settings.masterVolume,
  muted: settings.muted,
  sampleBase: GAME_CONFIG.audio.sampleBase
});
audio.attachUnlock(window);   // 任何一次点击/按键都会解锁 AudioContext

// ------------------------------------------------------------------ 数据加载

let roomsData = null;
let animatronicsData = null;

try {
  const [roomsRes, animatronicsRes] = await Promise.all([
    fetch(GAME_CONFIG.dataUrls.rooms, { cache: 'no-cache' }),
    fetch(GAME_CONFIG.dataUrls.animatronics, { cache: 'no-cache' })
  ]);
  if (!roomsRes.ok || !animatronicsRes.ok) {
    throw new Error(`HTTP ${roomsRes.status} / ${animatronicsRes.status}`);
  }
  roomsData = await roomsRes.json();
  animatronicsData = await animatronicsRes.json();
} catch (error) {
  showFatalError(error);
  throw error;   // 停下，不要在缺数据的情况下继续跑
}

const graph = new RoomGraph(roomsData);
const aiLevel = new AILevel(animatronicsData, { scale: settings.aiScale || 1 });

// ------------------------------------------------------------------ 手机模式

/**
 * 判断是否用「手机模式」（显示屏幕触控按钮）。
 *   设置里是 true / false 就用玩家的选择；
 *   是 null（还没手动选过）就自动检测：粗指针 + 没有 hover 的设备 = 触屏手机/平板。
 */
function resolveMobileMode(currentSettings) {
  if (typeof currentSettings.mobileMode === 'boolean') return currentSettings.mobileMode;
  if (typeof window.matchMedia !== 'function') return false;
  const coarse = window.matchMedia('(pointer: coarse)').matches;
  const noHover = !window.matchMedia('(hover: hover)').matches;
  const touchPoints = (navigator.maxTouchPoints || 0) > 0;
  return coarse && noHover && touchPoints;
}

// ------------------------------------------------------------------ 特效层

const canvasRenderer = new CanvasRenderer({ layers, graph });
// 可选素材：assets/images/rooms/<view>.png 存在就用贴图，不存在就用程序化绘制
canvasRenderer.loadRoomImages(graph.list.map((room) => room.view));

const staticNoise = new StaticNoise({ layers, fps: 30 });
const scanline = new Scanline({ layers });
const jumpScare = new JumpScare({ layers, staticNoise, scanline });

// ------------------------------------------------------------------ 服务容器

/** 所有场景共享的服务（依赖注入，场景之间不互相 import） */
const services = {
  config: GAME_CONFIG,
  roomsData,
  animatronicsData,
  graph,
  aiLevel,
  save,
  audio,
  layers,
  svgRenderer,
  canvasRenderer,
  staticNoise,
  scanline,
  jumpScare,
  session: null,
  /** 手机模式：菜单里可切换，办公场景据此决定要不要显示屏幕触控按钮 */
  mobile: {
    get enabled() {
      return resolveMobileMode(save.settings);
    },
    /** 是否处于「自动检测」状态（还没手动选过） */
    get isAuto() {
      return typeof save.settings.mobileMode !== 'boolean';
    },
    set(value) {
      save.setSettings({ mobileMode: !!value });
      return resolveMobileMode(save.settings);
    }
  },
  /** @type {SceneManager|null} 稍后赋值 */
  sceneManager: null,
  startNight
};

// ------------------------------------------------------------------ 一晚的组装

/**
 * 组装第 night 夜的全部运行时对象。
 * @param {number} night 1~7
 * @returns {object} session
 */
function startNight(night) {
  const currentSettings = save.settings;
  const nightDuration = currentSettings.nightDuration || GAME_CONFIG.nightDuration;

  // 种子：设置了固定 seed 就能复现同一局；否则每局不同
  const seedSource = currentSettings.seed != null ? `seed:${currentSettings.seed}:${night}` : `${Date.now()}:${night}`;
  const rng = new Random(seedSource);

  const session = {
    night,
    seed: rng.seed,
    rng,
    time: new TimeSystem({ nightDuration, night }),
    power: new PowerSystem(GAME_CONFIG.power),
    doors: new DoorSystem(GAME_CONFIG.doors),
    cameras: new CameraSystem({ graph, config: GAME_CONFIG.cameras }),
    player: new Player({ panShift: OFFICE_LAYOUT.panShift, panSpeed: 5.5 }),
    aiLevel,
    animatronics: []
  };

  // 每个玩偶一个独立随机源（fork）：同一晚里互不干扰，且可复现
  session.animatronics = animatronicsData.animatronics.map((def) =>
    new Animatronic(def, {
      graph,
      rng: rng.fork(def.id),
      aiLevel: aiLevel.levelFor(def.id, night, 0),
      emitter: new Emitter(),
      config: {
        nightGracePeriod: GAME_CONFIG.nightGracePeriod,
        moveAnimDuration: 0.55
      }
    })
  );

  services.session = session;
  console.info(
    `[main] Night ${night} 开始 · seed=${session.seed} · 时长=${nightDuration}s · AI=${JSON.stringify(aiLevel.levelsForNight(night, 0))}`
  );
  return session;
}

// ------------------------------------------------------------------ 主循环与场景

const loop = new GameLoop({ maxDelta: 0.05, timeScale: 1 });
const sceneManager = new SceneManager({ loop, services });
services.sceneManager = sceneManager;

sceneManager.register('menu', new MenuScene(services));
sceneManager.register('office', new OfficeScene(services));
sceneManager.register('jumpscare', new JumpScareScene(services));

// 每帧：先更新逻辑，再让当前场景绘制 Canvas 层
loop.onUpdate(({ dt, frame }) => {
  sceneManager.update(dt);
  sceneManager.draw(dt);
  updateDebugOverlay(dt, frame);
});

// 启动入口：默认进主菜单；
// 调试/自测可以直接用 URL 参数跳过菜单： index.html?night=4&debug=1
const params = new URLSearchParams(location.search);
const autoNight = Number(params.get('night'));
if (Number.isFinite(autoNight) && autoNight >= 1 && autoNight <= 7) {
  startNight(Math.floor(autoNight));
  sceneManager.start('office', { night: Math.floor(autoNight) });
} else {
  sceneManager.start('menu', {});
}
loop.start();

// 切到后台时暂停，回来时不至于一帧跨过好几个小时
document.addEventListener('visibilitychange', () => {
  if (document.hidden) loop.stop();
  else if (!loop.isRunning) loop.start();
});

// 调试入口：控制台里可以 __FNAF__.session / __FNAF__.services 直接改数据
window.__FNAF__ = { services, loop, sceneManager, graph, aiLevel };

// ------------------------------------------------------------------ 调试叠层（可选）

const DEBUG = new URLSearchParams(location.search).has('debug');
let debugEl = null;
let debugTimer = 0;

if (DEBUG) {
  const layer = svgRenderer.layer('debug', 99);
  debugEl = svgRenderer.text(12, 20, '', {
    fill: '#7fffd4',
    'font-size': 13,
    'font-family': 'Consolas, monospace'
  }, layer);
}

function updateDebugOverlay(dt, frame) {
  if (!DEBUG || !debugEl) return;
  debugTimer += dt;
  if (debugTimer < 0.25) return;
  debugTimer = 0;

  const s = services.session;
  const lines = [
    `FPS ${loop.fps}  frame ${frame}  scale ${layers.renderScale}  scene ${sceneManager.currentName}`
  ];
  if (s) {
    lines.push(`time ${s.time.hourLabel} (${Math.round(s.time.progress * 100)}%)  power ${s.power.percent.toFixed(1)}%  usage ${s.power.usageLevel}`);
    lines.push(`cam ${s.cameras.isOn ? s.cameras.currentRoomId : 'off'}  doors L:${s.doors.isDoorClosed('left') ? 'C' : 'O'}${s.doors.isLightOn('left') ? 'L' : '-'} R:${s.doors.isDoorClosed('right') ? 'C' : 'O'}${s.doors.isLightOn('right') ? 'L' : '-'}`);
    for (const a of s.animatronics) lines.push(a.debugLine());
  }

  // 清掉上一帧的 tspan，再写新的（只用一个 <text> 节点，不泄漏 DOM）
  while (debugEl.firstChild) debugEl.removeChild(debugEl.firstChild);
  lines.forEach((line, i) => {
    const tspan = createSvgEl('tspan', { x: 12, dy: i === 0 ? 0 : 16 }, debugEl);
    tspan.textContent = line;
  });
}

// ------------------------------------------------------------------ 致命错误界面

function showFatalError(error) {
  const layer = svgRenderer.layer('fatal', 999);
  svgRenderer.rect(0, 0, GAME_CONFIG.logicalWidth, GAME_CONFIG.logicalHeight, { fill: '#0a0507' }, layer);
  svgRenderer.text(640, 240, '启动失败', {
    'text-anchor': 'middle', fill: '#ff6b6b', 'font-size': 56, 'font-family': '"Trebuchet MS", sans-serif'
  }, layer);
  svgRenderer.multilineText(640, 320, [
    `无法加载游戏数据：${error?.message || error}`,
    '',
    '单文件版的数据和代码都内联在这一个 HTML 里，本来不需要服务器。',
    '看到这个错误，说明文件在复制 / 传输过程中被改坏了 —— 重新拿一份原始 HTML。',
    '也可以按 F12 打开控制台，把红色报错截图发出来。',
    '',
    ''
  ], {
    lineHeight: 30,
    attrs: {
      'text-anchor': 'middle',
      fill: '#cbd5e1',
      'font-size': 20,
      'font-family': '"Trebuchet MS", "Microsoft YaHei", sans-serif'
    },
    parent: layer
  });
}

exports.GAME_CONFIG = GAME_CONFIG;
  window.__FNAF_ENTRY__ = exports;   // 调试用：window.__FNAF_ENTRY__.GAME_CONFIG …
  window.__fnafBootOk && window.__fnafBootOk();
} catch (err) {
  console.error("[FNAF1 单文件版] 启动失败", err);
  window.__fnafBootFail && window.__fnafBootFail(err);
}
</script>
</body>
</html>
